interface:
  display_name: "活動情報を同期"
  short_description: "会話内の決定・予定・タスクをActivity Compassへ安全に反映"
  default_prompt: "Use $sync-activity to send this conversation activity to Activity Compass."

dependencies:
  tools:
    - type: "mcp"
      value: "activity-compass"
      description: "Activity Compassのローカル同期API"
      transport: "stdio"

policy:
  allow_implicit_invocation: true

