[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "activity-compass"
version = "0.1.0"
description = "Local-first activity manager synchronized from ChatGPT conversations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
activity-compass = "activity_compass.main:main"

[tool.setuptools]
package-dir = {"" = "app"}

[tool.setuptools.packages.find]
where = ["app"]

